name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (sync.sh, hooks, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON
        run: jq empty settings/settings.shared.json
      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR install/sync.sh hooks/*.sh tests/*.sh
      - name: Sync tests
        run: bash tests/test-sync.sh
      - name: Install gitleaks (off PATH, for the real-scan hook tests)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          asset=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "$base/$asset" -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $asset\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir gitleaks && tar -xzf "$asset" -C gitleaks gitleaks
      - name: Hook tests
        run: GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks bash tests/test-hooks.sh

  windows:
    name: Windows (sync.ps1, hooks under Git Bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $results = 'install/sync.ps1', 'tests/test-sync.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error, Warning }
          $results | Format-Table -AutoSize | Out-String | Write-Output
          if ($results) { exit 1 }
      - name: Sync tests (sync.ps1, plus parity with sync.sh)
        shell: powershell
        run: ./tests/test-sync.ps1
      - name: Sync tests (sync.sh under Git Bash)
        shell: bash
        run: bash tests/test-sync.sh
      - name: Install gitleaks (off PATH, for the real-scan hook tests)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          asset=gitleaks_${GITLEAKS_VERSION}_windows_x64.zip
          curl -fsSLO "$base/$asset" -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $asset\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir gitleaks && unzip -q "$asset" gitleaks.exe -d gitleaks
      - name: Hook tests under Git Bash
        shell: bash
        run: GITLEAKS_BIN=$(cygpath -u "$RUNNER_TEMP")/gitleaks/gitleaks.exe bash tests/test-hooks.sh
